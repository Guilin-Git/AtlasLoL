name: atlaslol

services:
  postgres:
    image: postgres:17.11-alpine3.24
    profiles: [core]
    restart: unless-stopped
    env_file:
      - /etc/atlas/postgres.env
    mem_limit: 384m
    cpus: "0.75"
    pids_limit: 128
    ports:
      - "192.168.3.6:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    image: atlaslol-api:local
    build:
      context: ../..
      dockerfile: api/Dockerfile
    profiles: [core]
    restart: unless-stopped
    env_file:
      - /etc/atlas/api.env
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    ports:
      - "192.168.3.6:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  memory-limit-probe:
    image: python:3.12-alpine
    profiles: [test]
    restart: "no"
    mem_limit: 100m
    memswap_limit: 100m
    cpus: "0.25"
    pids_limit: 64
    command:
      - python
      - -c
      - |
        blocks = []
        while True:
            blocks.append(bytearray(1024 * 1024))

volumes:
  postgres-data:
